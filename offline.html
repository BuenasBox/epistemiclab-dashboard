<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión — EpistemicLab</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#07090d;--panel:#10141b;--ink:#e6ebf4;--muted:#929daf;--cyan:#64d9f5;--gold:#e5c97a;--line:#293443}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:420px;text-align:center}
  .dot{width:44px;height:44px;border-radius:999px;background:var(--cyan);margin:0 auto 20px;
    box-shadow:0 0 0 1px rgba(100,217,245,.6) inset, 0 0 0 6px rgba(100,217,245,.08)}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:22px;margin:0 0 10px;font-weight:500}
  p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}
  .retry{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--bg);
    background:var(--cyan);border:none;border-radius:8px;padding:12px 22px;cursor:pointer}
  .retry:hover{background:#5ac8e8}
  .note{margin-top:28px;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Sin conexión por ahora</h1>
    <p>No podemos cargar esta página sin internet todavía. Si ya practicaste algo, tu progreso quedó guardado en este dispositivo y se sincronizará solo en cuanto vuelvas a tener conexión.</p>
    <button class="retry" onclick="location.reload()">Reintentar</button>
    <p class="note">Práctica formativa · EpistemicLab</p>
  </div>
</body>
</html>
