name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar suite de pruebas (node:test + validadores deterministas)
        run: npm test

      - name: Verificar que system_state.json está actualizado
        run: npm run state:check

      - name: Auditoría de dependencias (producción)
        run: npm run audit:dependencies

  lighthouse:
    name: Línea base de rendimiento (Lighthouse)
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar sitio minificado
        run: npm run build

      - name: Servir el sitio estático
        run: npx --yes http-server dist -p 4173 -s &

      - name: Esperar a que el servidor responda
        run: npx --yes wait-on http://127.0.0.1:4173

      - name: Lighthouse CI (presupuesto de rendimiento, Fase 2 — informativo por ahora)
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://127.0.0.1:4173/
            http://127.0.0.1:4173/dashboard/
            http://127.0.0.1:4173/bottle-lab/
            http://127.0.0.1:4173/diagnostic-sba/
            http://127.0.0.1:4173/sat-lab/
            http://127.0.0.1:4173/adaptive-session/
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
