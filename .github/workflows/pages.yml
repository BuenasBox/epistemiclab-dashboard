name: Deploy GitHub Pages

# Real security fix (Product Implementation Marathon): GitHub Pages was configured as
# "legacy" branch-source deployment (source: branch=main, path=/), which publishes the
# ENTIRE raw repository on every push -- verified live, content-bank/ (full answer keys,
# misconception mappings, evaluation rules, reveal content), supabase/functions/_shared/*
# (evaluator source), tests/, tools/ and docs/ were all publicly downloadable at
# https://epistemiclab.dpdns.org/, the domain actually named as production. Classic
# branch-source Pages only supports "/" or "/docs" as a path -- it cannot be pointed at
# the already-correct dist/ build (see tools/build-static.js's EXCLUDED_ROOTS, which
# already keeps every one of those directories out of dist/, exactly like the existing
# Vercel deploy). This workflow switches Pages to Actions-based deployment: build the
# same dist/ this repo already builds for Vercel, publish only that.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Zero Known Material Debt closure (Priority 15): "this problem must never happen again."
  # This alone can't stop someone from flipping Pages back to legacy branch-source deployment
  # in the repo Settings UI (that's not something a workflow can prevent), but it does make a
  # regression impossible to miss: every push to main re-asserts build_type == "workflow" and
  # fails the run in bright red if it isn't. See pages-config-check.yml for the same assertion
  # on a schedule, which also catches drift introduced with no code push at all.
  verify-pages-config:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: read
    steps:
      - name: Assert Pages is still Actions-deployed, not legacy branch-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          echo "Pages build_type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages build_type is '$build_type', not 'workflow'. This is the exact misconfiguration that once served the raw repo (content-bank/, supabase/functions/_shared/, tests/, tools/) publicly at the production domain. Fix it in Settings > Pages > Build and deployment > Source, set to 'GitHub Actions'."
            exit 1
          fi
