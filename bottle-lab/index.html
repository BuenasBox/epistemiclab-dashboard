<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="/icons/icon-192.png" type="image/png">

</head>
<body>
<div class="wrap">
  <div class="topline">
    <div class="flex-1"></div>
    <span class="chip gold" id="compChip">Aspecto · Teoría</span>
  </div>
  <div id="app" aria-live="polite"></div>
  <div class="note mt-24" id="fixtureNote">Práctica formativa · El Mentor evaluará tu razonamiento al finalizar.</div>
</div>

<script src="./data/bottle-items.sample.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
<script src="../shared/auth-token.js"></script>
<script src="../epistemic-profile/epistemic-profile-client.js"></script>
<script src="/ep-bootstrap.js"></script>
<script>
(function(){
  "use strict";
  var DATA = window.BOTTLE_GUIDED_ITEMS || { items: [] };
  var EP = window.EpistemicProfile;
  var app = document.getElementById('app');

  var TONE = { coincide:'ok', cerca:'near', revisar:'rev', contradiccion:'con' };
  var TONE_LABEL = { coincide:'Coincide', cerca:'Cerca', revisar:'Revisar', contradiccion:'Posible contradicción' };

  var S = null;
  function reset(itemIndex){
    var idx = itemIndex % (DATA.items.length || 1);
    S = { screen:'frame', itemIndex:idx, item:DATA.items[idx], phaseIdx:0,
          answers:{}, hyp:{}, finished:false };
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

  /* ---------- screen renderers ---------- */
  function render(){
    if(!S.item){ app.innerHTML = '<div class="card">No hay botellas en el set.</div>'; return; }
    document.getElementById('compChip').textContent = (S.item.competencies||[]).join(' · ');
    if(S.screen==='frame') return renderFrame();
    if(S.screen==='observe') return renderObserve();
    if(S.screen==='hypothesis') return renderHypothesis();
    if(S.screen==='evaluating') return renderEvaluating();
    if(S.screen==='reveal') return renderReveal();
    if(S.screen==='done') return renderDone();
  }

  function renderFrame(){
    app.innerHTML =
      '<div class="eyebrow">Módulo · inferencia contextual</div>'+
      '<h1 class="serif">Botellas</h1>'+
      '<p class="muted bl-narrow">Deduce el estilo de un vino observando la <b>botella</b>: forma, color del vidrio, formato, cierre y nivel. Entrenas tu ojo y tu razonamiento antes de oler nada.</p>'+
      '<div class="note bl-narrow mb-18">En el examen la cata es <b>ciega</b> — no verás la botella. Esto entrena la <b>teoría de envasado</b> y el hábito de formular hipótesis. <b>No memorizamos botellas: aprendemos a leerlas.</b></div>'+
      '<div class="card bl-narrow">'+
        '<div class="card-label">Esta sesión</div>'+
        '<h3>1 botella · 5 pasos de observación · ~5 min</h3>'+
        '<p class="small muted">Observas zona a zona, formulas tu hipótesis y el Mentor te devuelve qué cambió en ti.</p>'+
        '<div class="flowbar"><button class="btn primary" id="start">Empezar →</button></div>'+
      '</div>';
    document.getElementById('start').onclick = function(){
      EP && EP.startSession({ module:'bottle-guided', competencies:S.item.competencies });
      S.screen='observe'; S.phaseIdx=0; render();
    };
  }

  function bottleHtml(r){
    r = r||{};
    return '<div class="bottle shape-'+esc(r.shape||'burgundy')+' gc-'+esc(r.glassColor||'dark-green')+'">'+
      '<span class="cap"></span><span class="neck"></span><span class="body"></span><span class="lbl"></span></div>';
  }

  function timelineHtml(){
    var ph = S.item.phases;
    var out = '<div class="steps">';
    for(var i=0;i<ph.length;i++){
      var cls = i<S.phaseIdx?'done':(i===S.phaseIdx?'active':'');
      var mk = i<S.phaseIdx?'<span class="ep-icon ep-icon--success" aria-hidden="true"></span>':(i===S.phaseIdx?'<span class="ep-icon ep-icon--current-step" aria-hidden="true"></span>':'<span class="ep-icon ep-icon--pending-step" aria-hidden="true"></span>');
      out += '<div class="step '+cls+'"><span class="dot">'+mk+'</span><span class="lbl">'+esc(ph[i].label)+'</span></div>';
    }
    return out+'</div>';
  }

  function renderObserve(){
    var ph = S.item.phases[S.phaseIdx];
    var sel = S.answers[ph.id];
    var optsHtml = ph.options.map(function(o){
      return '<button class="opt'+(sel===o.id?' sel':'')+'" data-opt="'+esc(o.id)+'">'+esc(o.text)+
        (o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</button>';
    }).join('');
    var m = ph.mentor||{sev:'info',text:''};
    app.innerHTML =
      '<div class="eyebrow">Observa la botella · paso '+(S.phaseIdx+1)+' de '+S.item.phases.length+'</div>'+
      '<h2 class="serif">'+esc(ph.prompt)+'</h2>'+
      timelineHtml()+
      '<div class="grid g2"><div>'+
        '<div class="card center"><div class="card-label card-label-left">Botella en observación · identidad oculta</div>'+bottleHtml(S.item.render)+'</div>'+
        '<div class="card tight mt-14"><div class="card-label">'+esc(ph.label)+'</div>'+optsHtml+'</div>'+
        '<div class="flowbar">'+
          (S.phaseIdx>0?'<button class="btn ghost" id="back">Atrás</button>':'')+
          '<button class="btn primary flex-1" id="next" '+(sel?'':'disabled')+'>Confirmar y seguir →</button>'+
        '</div>'+
      '</div><div>'+
        '<div class="card-label">Mentor</div>'+
        '<div class="mentor '+esc(m.sev)+'"><div class="avatar"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span></div><div><div class="sev">PISTA</div><p class="small mentor-text">'+esc(m.text)+'</p></div></div>'+
        '<div class="state eval"><span class="d"></span> El Mentor analizará tu deducción al confirmar</div>'+
        '<div class="note mt-14">El razonamiento se valora más que el acierto. La identidad no se revela hasta el final (gobernanza).</div>'+
      '</div></div>';
    app.querySelectorAll('[data-opt]').forEach(function(b){
      b.onclick = function(){ S.answers[ph.id]=b.getAttribute('data-opt'); render(); };
    });
    var back=document.getElementById('back'); if(back) back.onclick=function(){ S.phaseIdx--; render(); };
    document.getElementById('next').onclick = function(){
      var opt = ph.options.filter(function(o){return o.id===sel;})[0]||{};
      EP && EP.decisionMade({ competency:(S.item.competencies||[])[0], itemId:S.item.id, phaseId:ph.id,
        response:sel, correctnessBand:opt.band, novel:S.item.novel });
      if(S.phaseIdx < S.item.phases.length-1){ S.phaseIdx++; render(); }
      else { S.screen='hypothesis'; render(); }
    };
  }

  function hypGroup(key, group){
    var sel = S.hyp[key];
    return '<div class="card-label'+(key==='positioning'?' mt-14':'')+'">'+esc(group.prompt)+'</div>'+
      group.options.map(function(o){
        return '<button class="opt'+(sel===o.id?' sel':'')+'" data-hyp="'+key+'" data-opt="'+esc(o.id)+'">'+esc(o.text)+'</button>';
      }).join('');
  }

  function renderHypothesis(){
    var h = S.item.hypothesis;
    var ready = S.hyp.style && S.hyp.positioning;
    app.innerHTML =
      '<div class="eyebrow">Integra las pistas</div><h2 class="serif">Tu hipótesis</h2>'+
      '<p class="muted small bl-narrow">Has observado las cinco zonas. ¿Qué deduces del conjunto? Justifica con la combinación, no con una sola pista.</p>'+
      '<div class="grid g2"><div class="card">'+ hypGroup('style',h.style) + hypGroup('positioning',h.positioning) +'</div>'+
      '<div><div class="mentor warn"><div class="avatar"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span></div><div><div class="sev">ATENCIÓN</div><p class="small mentor-text">La forma es <i>tradición</i>, no ley. Una botella puede sorprender: lo que vale es tu razonamiento.</p></div></div>'+
      '<div class="flowbar"><button class="btn ghost" id="back">Atrás</button><button class="btn primary flex-1" id="submit" '+(ready?'':'disabled')+'>Enviar hipótesis →</button></div>'+
      '</div></div>';
    app.querySelectorAll('[data-hyp]').forEach(function(b){
      b.onclick=function(){ S.hyp[b.getAttribute('data-hyp')]=b.getAttribute('data-opt'); render(); };
    });
    document.getElementById('back').onclick=function(){ S.screen='observe'; S.phaseIdx=S.item.phases.length-1; render(); };
    document.getElementById('submit').onclick=function(){
      var hs=S.item.hypothesis;
      var so=hs.style.options.filter(function(o){return o.id===S.hyp.style;})[0]||{};
      var po=hs.positioning.options.filter(function(o){return o.id===S.hyp.positioning;})[0]||{};
      EP && EP.hypothesisSubmitted({ competency:'Conclusiones', itemId:S.item.id,
        style:{response:S.hyp.style,band:so.band}, positioning:{response:S.hyp.positioning,band:po.band} });
      S.finished=true;            // finish-gate: sólo ahora se puede revelar
      S.screen='evaluating'; render();
    };
  }

  function renderEvaluating(){
    app.innerHTML =
      '<div class="center bl-evaluating">'+
      '<div class="avatar bl-avatar-lg"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span></div>'+
      '<div class="state eval"><span class="d"></span> Analizando tu deducción…</div>'+
      '<p class="muted small mt-14"><a href="#" id="see" class="gold">ver resultado</a></p></div>';
    var go=function(e){ if(e)e.preventDefault(); S.screen='reveal'; render(); };
    document.getElementById('see').onclick=go;
    var t=setTimeout(go,900);     // timeout, no es animación; ok bajo reduce-motion
    app._t=t;
  }

  function renderReveal(){
    if(!S.finished){ S.screen='observe'; return render(); } // gobernanza
    var it=S.item, rv=it.reveal;
    // feedback por fase
    var rows = it.phases.map(function(ph){
      var sel=S.answers[ph.id]; var opt=ph.options.filter(function(o){return o.id===sel;})[0]||{};
      var tone=TONE[opt.band]||'rev';
      return '<div class="fb-row"><span class="small">'+esc(ph.label)+': '+esc((opt.text||'').split('(')[0])+'</span>'+
        '<span class="tone '+tone+'">'+esc(TONE_LABEL[opt.band]||'Revisar')+'</span>'+
        '<span class="small muted">'+esc(opt.explain||'')+'</span></div>';
    }).join('');
    var hs=it.hypothesis;
    var so=hs.style.options.filter(function(o){return o.id===S.hyp.style;})[0]||{};
    var hypTone=TONE[so.band]||'rev';
    var badges=(rv.badges||[]).map(function(b){return '<span class="chip gold">'+esc(b)+'</span>';}).join(' ');
    EP && rv.misconception && EP.misconception({ id:rv.misconception.id, status:'resolved', title:rv.misconception.title });
    app.innerHTML =
      '<div class="bl-reveal">'+
      '<div class="eyebrow">Revelación</div><h2 class="serif">Era… '+esc(rv.identity)+'</h2>'+
      '<div class="grid g2"><div>'+
        '<div class="card center">'+bottleHtml(it.render)+'<div class="mt-10">'+badges+'</div></div>'+
        '<div class="card tight mt-14"><div class="card-label">Tus lecturas</div>'+rows+
          '<div class="fb-row"><span class="small">Hipótesis de estilo</span><span class="tone '+hypTone+'">'+esc(TONE_LABEL[so.band]||'Revisar')+'</span><span class="small muted">'+esc((so.text||''))+'</span></div>'+
        '</div>'+
      '</div><div>'+
        '<div class="mentor ok"><div class="avatar"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span></div><div><div class="sev">SÍNTESIS</div><p class="small mentor-text">'+esc(rv.mentorSynthesis)+'</p></div></div>'+
        (rv.misconception?'<div class="mentor crit"><div class="avatar"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span></div><div><div class="sev">CONCEPTO CLAVE</div><p class="small mentor-text"><b>'+esc(rv.misconception.title)+'.</b> '+esc(rv.misconception.text)+'</p></div></div>':'')+
        '<div class="flowbar"><button class="btn primary flex-1" id="toDone">Ver qué cambió en ti →</button></div>'+
      '</div></div></div>';
    document.getElementById('toDone').onclick=function(){
      EP && EP.sessionCompleted({ module:'bottle-guided', itemId:it.id });
      S.screen='done'; render();
    };
    animateBlReveal();
  }
  // Reveal animado — Fase de animación unificada del sistema: mismo espíritu
  // que Open Response Lab / Mentor / Dashboard (revelación en cascada, no un
  // veredicto seco), adaptado a los bloques ya existentes de esta página
  // (.fb-row / .mentor en la revelación, .celebrate / .delta / .meter en el
  // cierre). Escopado a .bl-reveal / .bl-done para no tocar otras pantallas.
  // Respeta prefers-reduced-motion.
  function blReduceMotion(){
    return typeof window!=='undefined' && window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function blStagger(nodes,startDelay,gap){
    nodes.forEach(function(el,i){ setTimeout(function(){ el.classList.add('bl-in'); }, startDelay+i*gap); });
  }
  function animateBlReveal(){
    var root=app.querySelector('.bl-reveal');
    if(!root) return;
    var rows=root.querySelectorAll('.fb-row');
    var mentors=root.querySelectorAll('.mentor');
    if(blReduceMotion()){
      rows.forEach(function(el){el.classList.add('bl-in');});
      mentors.forEach(function(el){el.classList.add('bl-in');});
      return;
    }
    blStagger(rows,80,90);
    blStagger(mentors,80+rows.length*90+150,140);
  }

  function renderDone(){
    var d = (EP && EP.getSessionDelta()) || { accuracy:'—', misconceptions:[], transferTouched:false, competencies:S.item.competencies };
    var misc = (d.misconceptions||[]).map(function(m){
      return '<div class="delta"><div class="ic"><span class="ep-icon ep-icon--insight" aria-hidden="true"></span></div><div><b class="small">Idea consolidada</b><div class="xs muted mt-2">'+esc(m.title||'Concepto reforzado')+'</div></div></div>';
    }).join('');
    var transfer = d.transferTouched ?
        '<div class="delta"><div class="ic"><span class="ep-icon ep-icon--transfer" aria-hidden="true"></span></div><div><b class="small">Transferencia probada</b><div class="xs muted mt-2">Aplicado a una botella reservada como nueva → señal de aprendizaje real, no memoria.</div></div></div>' : '';
    app.innerHTML =
      '<div class="bl-done">'+
      '<div class="center bl-done-narrow"><div class="celebrate"><span class="ep-icon ep-icon--success" aria-hidden="true"></span><span class="ep-sr-only">Completado</span></div>'+
      '<h2 class="serif">Qué cambió en ti</h2><p class="muted small">No "bien hecho": esto es lo que ahora razonas distinto.</p></div>'+
      '<div class="bl-done-body">'+
        '<div class="delta"><div class="ic"><span class="ep-icon ep-icon--reference-material" aria-hidden="true"></span></div><div><b class="small">Análisis visual + Teoría de envasado</b><div class="meter mt-6"><span data-w="74"></span></div><div class="xs muted mt-4">Lectura de pistas físicas reforzada · aciertos en esta sesión: '+esc(d.accuracy)+'</div></div></div>'+
        misc + transfer +
        '<div class="delta delta-gold"><div class="ic"><span class="ep-icon ep-icon--progress-dashboard" aria-hidden="true"></span></div><div><b class="small">Aporte a Exam Readiness <span class="plus">registrado</span></b><div class="xs muted mt-2">El Epistemic Profile recibió las señales de esta sesión. <i>(Stub hasta el módulo de perfil.)</i></div></div></div>'+
        '<div class="state done mt-8"><span class="d"></span> Epistemic Profile actualizado · repaso espaciado programado</div>'+
        '<div class="flowbar flowbar-center"><button class="btn" id="another">Otra botella</button><a class="btn ghost" href="/login/?next=/dashboard/">Guardar mi progreso</a><a class="btn ghost" href="../">Volver a Mi progreso</a></div>'+
      '</div></div>';
    document.getElementById('another').onclick=function(){ reset(S.itemIndex+1); render(); };
    animateBlDone();
  }
  function animateBlDone(){
    var root=app.querySelector('.bl-done');
    if(!root) return;
    var celeb=root.querySelector('.celebrate');
    var deltas=root.querySelectorAll('.delta');
    var bars=root.querySelectorAll('.meter>span');
    if(blReduceMotion()){
      if(celeb) celeb.classList.add('bl-in');
      deltas.forEach(function(el){el.classList.add('bl-in');});
      bars.forEach(function(b){ b.style.setProperty('--progress', (b.getAttribute('data-w')||'0')+'%'); });
      return;
    }
    if(celeb) celeb.classList.add('bl-in');
    blStagger(deltas,180,110);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        bars.forEach(function(b){ b.style.setProperty('--progress', (b.getAttribute('data-w')||'0')+'%'); });
      });
    });
  }

  /* ---------- boot ---------- */
  reset(0);
  render();
})();
</script>
<script src="/platform-nav.js" defer></script>
</body>
</html>
