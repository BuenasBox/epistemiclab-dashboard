<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botellas — EpistemicLab</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="/platform-nav.css"><link rel="stylesheet" href="/shared/epistemic-icons.css"><link rel="stylesheet" href="/shared/theme-wine.css"><link rel="stylesheet" href="/shared/theme-platform.css"><link rel="stylesheet" href="/shared/ui-buttons.css"><link rel="stylesheet" href="./bottle-lab.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script><script src="/shared/supabase-public-config.js"></script><script src="../shared/auth-token.js"></script><script src="../epistemic-profile/epistemic-profile-client.js"></script><script src="/ep-bootstrap.js"></script>
</head>
<body><div class="wrap"><header class="topline"><div class="flex-1"></div><span class="chip gold" id="statusChip">Bottle Lab Pro</span></header><main id="app" aria-live="polite"></main><div class="note mt-24" id="networkStatus" hidden></div></div>
<script>
(function(){'use strict';
var app=document.getElementById('app'),chip=document.getElementById('statusChip'),network=document.getElementById('networkStatus');
var API=((window.WSET_SUPABASE_CONFIG||{}).url||'')+'/functions/v1/',KEY=(window.WSET_SUPABASE_CONFIG||{}).publishableKey||'';
var state={session:null,step:null,selection:'',evidence:[],confidence:'',justification:'',committed:false,busy:false};
var CONF_ORDER=['cannot_determine','intuition','probable','fairly_sure','certain'];
var CONF_LABEL={cannot_determine:'No puede determinarse',intuition:'Intuyo',probable:'Probable',fairly_sure:'Bastante seguro',certain:'Seguro'};
var KIND_LABEL={observation:'Observación',classification:'Clasificación',hypothesis:'Hipótesis'};
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function setNetwork(){network.hidden=navigator.onLine;network.textContent='Sin conexión. La sesión no se enviará hasta recuperar la red.';}window.addEventListener('online',setNetwork);window.addEventListener('offline',setNetwork);setNetwork();
function loading(text){chip.textContent='Cargando sesión';app.innerHTML='<div class="center bl-evaluating"><div class="avatar bl-avatar-lg"><span class="ep-icon ep-icon--mentor"></span></div><div class="state eval"><span class="d"></span>'+esc(text)+'</div></div>';}
function error(message,login){chip.textContent='Bottle Lab Pro';app.innerHTML='<div class="card bl-narrow"><div class="card-label">No pudimos continuar</div><h2 class="serif">'+esc(message)+'</h2><p class="small muted">Tu progreso server-side no se ha marcado como completado.</p><div class="flowbar"><button class="btn btn--ghost" id="retry">Reintentar</button>'+(login?'<a class="btn btn--shine" href="/login/?next=/bottle-lab/">Iniciar sesión</a>':'')+'</div></div>';document.getElementById('retry').onclick=start;}
function publicDemo(){chip.textContent='Demo pública · sin progreso';app.innerHTML='<div class="eyebrow">Módulo · inferencia física</div><h1 class="serif">Botellas</h1><p class="muted bl-narrow">Aprende a distinguir señales técnicas, tradición, marketing y evidencia no diagnóstica.</p><div class="grid g2"><div class="card center"><div class="bottle shape-burgundy gc-dark-green"><span class="cap"></span><span class="neck"></span><span class="body"></span><span class="lbl"></span></div></div><div class="card"><div class="card-label">Demo segura</div><p class="small">La práctica Pro evalúa observación, hipótesis, evidencia y confianza en servidor.</p><div class="state eval"><span class="d"></span>La asignación Pro requiere una cuenta activa.</div><div class="flowbar"><a class="btn btn--shine btn--glow flex-1" href="/login/?next=/bottle-lab/">Entrar para practicar</a></div></div></div>';}
function stepView(){
  var s=state.step;if(!s)return error('No hay un paso activo.');
  chip.textContent='Bottle Lab Pro · '+(KIND_LABEL[s.kind]||s.kind);
  var hasChoice=(s.options||[]).length>0;
  var locked=hasChoice&&state.committed;
  var opts=(s.options||[]).map(function(o){return '<button class="btn btn--ghost opt '+(state.selection===o.id?'sel':'')+(locked?' locked':'')+'" data-option="'+esc(o.id)+'" '+(locked?'disabled':'')+'>'+esc(o.text||o.id)+'</button>';}).join('');
  var ev=(s.evidence||[]).map(function(e){var used=state.evidence.indexOf(e.id)>=0;return '<button class="btn btn--ghost opt ev '+(used?'sel':'')+'" data-evidence="'+esc(e.id)+'"><b>'+esc(e.label)+'</b><small>'+esc(e.value)+'</small><span class="use-state">'+(used?'usada en tu lectura':'sin usar')+'</span></button>';}).join('');
  var conf=CONF_ORDER.map(function(c){return '<button class="btn btn--ghost pillbtn '+(state.confidence===c?'sel':'')+(locked?' locked':'')+'" data-confidence="'+c+'" '+(locked?'disabled':'')+'>'+CONF_LABEL[c]+'</button>';}).join('');
  var commitBar=!hasChoice?'':(state.committed?
    '<div class="commit-bar is-committed"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span><div><b>Hipótesis comprometida</b>Esto era lo que pensabas con la información disponible en este momento. Si aparece evidencia nueva, la revisión quedará registrada aparte.</div></div>'
    :'<div class="commit-bar"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span><div><b>Todavía no has comprometido tu hipótesis</b>Elige una lectura y una confianza para comprometerte.</div></div>');
  var canCommit=hasChoice&&!state.committed&&state.selection&&state.confidence;
  var readyNoChoice=!hasChoice&&(state.confidence||state.justification);
  var showCommitBtn=hasChoice&&!state.committed;
  var showSendBtn=(!hasChoice&&readyNoChoice)||(hasChoice&&state.committed);
  app.innerHTML='<div class="eyebrow">Bottle Lab Pro · '+(KIND_LABEL[s.kind]||'paso activo')+'</div><h2 class="serif">'+esc(s.prompt||s.id)+'</h2><div class="grid g2"><div><div class="card"><div class="card-label">Evidencia observada</div><p class="small muted">Marca la evidencia que realmente usas para tu lectura -- el resto queda registrada como observada, no usada.</p>'+ev+'</div></div><div class="card"><div class="card-label">Tu lectura</div>'+opts+'<textarea id="justification" class="opt" rows="3" placeholder="Explica qué permite y qué no permite inferir…" '+(locked?'disabled':'')+'>'+esc(state.justification)+'</textarea><div class="conf"><div class="q">¿Qué tan seguro estás?</div><div class="opts">'+conf+'</div></div>'+commitBar+'<div class="flowbar">'+(showCommitBtn?'<button class="btn btn--shine flex-1" id="commit" '+(canCommit?'':'disabled')+'>Comprometer hipótesis</button>':'<button class="btn btn--shine btn--glow flex-1" id="send" '+(showSendBtn?'':'disabled')+'>Enviar paso →</button>')+'</div></div></div>';
  app.querySelectorAll('[data-option]').forEach(function(b){b.onclick=function(){if(locked)return;state.selection=b.dataset.option;stepView();};});
  app.querySelectorAll('[data-evidence]').forEach(function(b){b.onclick=function(){var i=state.evidence.indexOf(b.dataset.evidence);if(i>=0)state.evidence.splice(i,1);else state.evidence.push(b.dataset.evidence);stepView();};});
  app.querySelectorAll('[data-confidence]').forEach(function(b){b.onclick=function(){if(locked)return;state.confidence=b.dataset.confidence;stepView();};});
  var ta=document.getElementById('justification');if(ta)ta.oninput=function(){state.justification=ta.value;};
  var commitBtn=document.getElementById('commit');if(commitBtn)commitBtn.onclick=function(){state.committed=true;stepView();};
  var sendBtn=document.getElementById('send');if(sendBtn)sendBtn.onclick=submit;
}
function mentorInterstitial(feedback,next){
  chip.textContent='Bottle Lab Pro · Mentor';
  app.innerHTML='<div class="eyebrow">Mentor</div><div class="mentor info"><div class="avatar"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span></div><div><div class="sev">'+esc((feedback.category||'observación').toUpperCase())+'</div><p class="small mentor-text">'+esc(feedback.text)+'</p></div></div><div class="flowbar"><button class="btn btn--shine btn--glow flex-1" id="mentorNext">Continuar →</button></div>';
  document.getElementById('mentorNext').onclick=next;
}
async function api(path,body){if(!navigator.onLine)throw Error('OFFLINE');var token=await getAuthToken();if(!token)throw Error('NO_AUTH_SESSION');var res=await fetch(API+path,{method:'POST',cache:'no-store',headers:{Authorization:'Bearer '+token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});var data=await res.json().catch(function(){return{};});if(!res.ok)throw Error(data.error||'REQUEST_FAILED');return data;}
function requestKey(){var k=sessionStorage.getItem('bottle_lab_pro_request_key');if(!k){k=crypto.randomUUID();sessionStorage.setItem('bottle_lab_pro_request_key',k);}return k;}
async function start(){loading('Recuperando tu sesión…');try{var d=await api('start-bottle-session',{request_key:requestKey()});state.session=d.session_id;state.step=d.step;window.EpistemicProfile&&window.EpistemicProfile.startSession({module:'bottle-lab-pro',mode:'server',competencies:['Bottle Lab Pro']});stepView();}catch(e){if(e.message==='NO_AUTH_SESSION')error('La práctica Pro requiere iniciar sesión.',true);else if(e.message==='OFFLINE')error('Estás sin conexión.');else error('La asignación no está disponible.');}}
async function submit(){if(state.busy)return;state.busy=true;loading('Evaluando tu razonamiento en servidor…');try{var d=await api('submit-bottle-step',{session_id:state.session,idempotency_key:crypto.randomUUID(),step_key:state.step.id,step_kind:state.step.kind,answer:{response:state.selection||'cannot_determine',evidence_used:state.evidence,justification:state.justification,confidence:state.confidence}});var advance=function(){if(d.step){state.step=d.step;state.selection='';state.evidence=[];state.confidence='';state.justification='';state.committed=false;stepView();}else reveal();};var feedback=d.evaluation&&d.evaluation.mentor_feedback;if(feedback&&feedback.text)mentorInterstitial(feedback,advance);else advance();}catch(e){error(e.message==='OFFLINE'?'Estás sin conexión.':'No pudimos guardar este paso.');}finally{state.busy=false;}}
var REVEAL_MOMENTOS=['layer1','layer2','layer3','layer4'];
var REVEAL_LABEL={layer1:'Qué ocurrió',layer2:'Qué pensabas',layer3:'Cómo usaste la evidencia',layer4:'Regla transferible'};
var revealData=null,revealStep=0;
function revealView(){
  var r=revealData,key=REVEAL_MOMENTOS[revealStep];
  var progress=REVEAL_MOMENTOS.map(function(_,i){return '<span class="'+(i<=revealStep?'done':'')+'"></span>';}).join('');
  var isLast=revealStep===REVEAL_MOMENTOS.length-1;
  app.innerHTML='<div class="bl-reveal"><div class="eyebrow">Reveal autorizado por servidor · '+(revealStep+1)+'/'+REVEAL_MOMENTOS.length+'</div><div class="reveal-progress">'+progress+'</div><div class="mentor '+(revealStep===0?'ok':'info')+'"><div class="avatar"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span></div><div><div class="sev">'+esc(REVEAL_LABEL[key].toUpperCase())+'</div><p class="small mentor-text">'+esc(r[key])+'</p></div></div><div class="reveal-nav">'+(revealStep>0?'<button class="btn btn--ghost" id="rprev">← Anterior</button>':'<span></span>')+(isLast?'<a class="btn btn--shine btn--glow" href="/bottle-lab/">Intentar otro caso</a>':'<button class="btn btn--shine" id="rnext">Siguiente →</button>')+'</div></div>';
  var prev=document.getElementById('rprev');if(prev)prev.onclick=function(){revealStep--;revealView();};
  var next=document.getElementById('rnext');if(next)next.onclick=function(){revealStep++;revealView();};
}
async function reveal(){loading('Preparando reveal autorizado…');try{var d=await api('reveal-bottle-session',{session_id:state.session});revealData=d.reveal||{};revealStep=0;window.EpistemicProfile&&window.EpistemicProfile.sessionCompleted({module:'bottle-lab-pro',itemId:state.session});revealView();}catch(e){error('El reveal todavía no está autorizado.');}}
publicDemo();(async function(){try{if(await getAuthToken())start();}catch(_){}})();
})();
</script><script src="/platform-nav.js" defer></script></body></html>
