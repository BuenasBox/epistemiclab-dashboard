<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botellas — EpistemicLab</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="/platform-nav.css"><link rel="stylesheet" href="/shared/epistemic-icons.css"><link rel="stylesheet" href="/shared/theme-wine.css"><link rel="stylesheet" href="/shared/theme-platform.css"><link rel="stylesheet" href="/shared/ui-buttons.css"><link rel="stylesheet" href="./bottle-lab.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script><script src="/shared/supabase-public-config.js"></script><script src="../shared/auth-token.js"></script><script src="../epistemic-profile/epistemic-profile-client.js"></script><script src="/ep-bootstrap.js"></script>
</head>
<body><div class="wrap"><header class="topline"><div class="flex-1"></div><span class="chip gold" id="statusChip">Bottle Lab Pro</span></header><main id="app" aria-live="polite"></main><div class="note mt-24" id="networkStatus" hidden></div></div>
<script>
(function(){'use strict';
var app=document.getElementById('app'),chip=document.getElementById('statusChip'),network=document.getElementById('networkStatus');
var API=((window.WSET_SUPABASE_CONFIG||{}).url||'')+'/functions/v1/',KEY=(window.WSET_SUPABASE_CONFIG||{}).publishableKey||'';
var state={session:null,step:null,selection:'',evidence:[],confidence:'',justification:'',busy:false};
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function setNetwork(){network.hidden=navigator.onLine;network.textContent='Sin conexión. La sesión no se enviará hasta recuperar la red.';}window.addEventListener('online',setNetwork);window.addEventListener('offline',setNetwork);setNetwork();
function loading(text){chip.textContent='Cargando sesión';app.innerHTML='<div class="center bl-evaluating"><div class="avatar bl-avatar-lg"><span class="ep-icon ep-icon--mentor"></span></div><div class="state eval"><span class="d"></span>'+esc(text)+'</div></div>';}
function error(message,login){chip.textContent='Bottle Lab Pro';app.innerHTML='<div class="card bl-narrow"><div class="card-label">No pudimos continuar</div><h2 class="serif">'+esc(message)+'</h2><p class="small muted">Tu progreso server-side no se ha marcado como completado.</p><div class="flowbar"><button class="btn btn--ghost" id="retry">Reintentar</button>'+(login?'<a class="btn btn--shine" href="/login/?next=/bottle-lab/">Iniciar sesión</a>':'')+'</div></div>';document.getElementById('retry').onclick=start;}
function publicDemo(){chip.textContent='Demo pública · sin progreso';app.innerHTML='<div class="eyebrow">Módulo · inferencia física</div><h1 class="serif">Botellas</h1><p class="muted bl-narrow">Aprende a distinguir señales técnicas, tradición, marketing y evidencia no diagnóstica.</p><div class="grid g2"><div class="card center"><div class="bottle shape-burgundy gc-dark-green"><span class="cap"></span><span class="neck"></span><span class="body"></span><span class="lbl"></span></div></div><div class="card"><div class="card-label">Demo segura</div><p class="small">La práctica Pro evalúa observación, hipótesis, evidencia y confianza en servidor.</p><div class="state eval"><span class="d"></span>La asignación Pro requiere una cuenta activa.</div><div class="flowbar"><a class="btn btn--shine btn--glow flex-1" href="/login/?next=/bottle-lab/">Entrar para practicar</a></div></div></div>';}
function stepView(){var s=state.step;if(!s)return error('No hay un paso activo.');chip.textContent='Bottle Lab Pro · '+s.kind;var opts=(s.options||[]).map(function(o){return '<button class="btn btn--ghost opt '+(state.selection===o.id?'sel':'')+'" data-option="'+esc(o.id)+'">'+esc(o.text||o.id)+'</button>';}).join('');var ev=(s.evidence||[]).map(function(e){return '<button class="btn btn--ghost opt '+(state.evidence.indexOf(e.id)>=0?'sel':'')+'" data-evidence="'+esc(e.id)+'"><b>'+esc(e.label)+'</b><small>'+esc(e.value)+'</small></button>';}).join('');var ready=state.selection||state.confidence||state.justification;app.innerHTML='<div class="eyebrow">Bottle Lab Pro · paso activo</div><h2 class="serif">'+esc(s.prompt||s.id)+'</h2><div class="steps"><div class="step active"><span class="dot">1</span><span class="lbl">Observa</span></div><div class="step active"><span class="dot">2</span><span class="lbl">Clasifica</span></div><div class="step"><span class="dot">3</span><span class="lbl">Hipótesis</span></div></div><div class="grid g2"><div><div class="card"><div class="card-label">Señales visibles</div><p class="small muted">El servidor entrega únicamente la evidencia visible de este paso.</p>'+ev+'</div></div><div class="card"><div class="card-label">Tu lectura</div>'+opts+'<textarea id="justification" class="opt" rows="3" placeholder="Explica qué permite y qué no permite inferir…">'+esc(state.justification)+'</textarea><div class="conf"><div class="q">Confianza</div><div class="opts">'+['cannot_determine','intuition','probable','fairly_sure','certain'].map(function(c){return '<button class="btn btn--ghost pillbtn '+(state.confidence===c?'sel':'')+'" data-confidence="'+c+'">'+c+'</button>';}).join('')+'</div></div><div class="flowbar"><button class="btn btn--shine btn--glow flex-1" id="send" '+(ready?'':'disabled')+'>Enviar paso →</button></div></div></div>';app.querySelectorAll('[data-option]').forEach(function(b){b.onclick=function(){state.selection=b.dataset.option;stepView();};});app.querySelectorAll('[data-evidence]').forEach(function(b){b.onclick=function(){var i=state.evidence.indexOf(b.dataset.evidence);if(i>=0)state.evidence.splice(i,1);else state.evidence.push(b.dataset.evidence);stepView();};});app.querySelectorAll('[data-confidence]').forEach(function(b){b.onclick=function(){state.confidence=b.dataset.confidence;stepView();};});var ta=document.getElementById('justification');ta.oninput=function(){state.justification=ta.value;};document.getElementById('send').onclick=submit;}
async function api(path,body){if(!navigator.onLine)throw Error('OFFLINE');var token=await getAuthToken();if(!token)throw Error('NO_AUTH_SESSION');var res=await fetch(API+path,{method:'POST',cache:'no-store',headers:{Authorization:'Bearer '+token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});var data=await res.json().catch(function(){return{};});if(!res.ok)throw Error(data.error||'REQUEST_FAILED');return data;}
function requestKey(){var k=sessionStorage.getItem('bottle_lab_pro_request_key');if(!k){k=crypto.randomUUID();sessionStorage.setItem('bottle_lab_pro_request_key',k);}return k;}
async function start(){loading('Recuperando tu sesión…');try{var d=await api('start-bottle-session',{request_key:requestKey()});state.session=d.session_id;state.step=d.step;window.EpistemicProfile&&window.EpistemicProfile.startSession({module:'bottle-lab-pro',mode:'server',competencies:['Bottle Lab Pro']});stepView();}catch(e){if(e.message==='NO_AUTH_SESSION')error('La práctica Pro requiere iniciar sesión.',true);else if(e.message==='OFFLINE')error('Estás sin conexión.');else error('La asignación no está disponible.');}}
async function submit(){if(state.busy)return;state.busy=true;loading('Evaluando tu razonamiento en servidor…');try{var d=await api('submit-bottle-step',{session_id:state.session,idempotency_key:crypto.randomUUID(),step_key:state.step.id,step_kind:state.step.kind,answer:{response:state.selection||'cannot_determine',evidence_used:state.evidence,justification:state.justification,confidence:state.confidence}});if(d.step){state.step=d.step;state.selection='';state.evidence=[];state.confidence='';state.justification='';stepView();}else reveal();}catch(e){error(e.message==='OFFLINE'?'Estás sin conexión.':'No pudimos guardar este paso.');}finally{state.busy=false;}}
async function reveal(){loading('Preparando reveal autorizado…');try{var d=await api('reveal-bottle-session',{session_id:state.session}),r=d.reveal||{};window.EpistemicProfile&&window.EpistemicProfile.sessionCompleted({module:'bottle-lab-pro',itemId:state.session});chip.textContent='Bottle Lab Pro · completado';app.innerHTML='<div class="bl-reveal"><div class="eyebrow">Reveal autorizado por servidor</div><h2 class="serif">Qué cambió en tu inferencia</h2><div class="grid g2"><div class="card center"><div class="bottle shape-burgundy gc-dark-green"><span class="cap"></span><span class="neck"></span><span class="body"></span><span class="lbl"></span></div></div><div><div class="mentor ok"><div class="avatar"><span class="ep-icon ep-icon--mentor"></span></div><div><div class="sev">RESULTADO</div><p class="small mentor-text">'+esc(r.layer1)+'</p></div></div><div class="card tight"><div class="card-label">Hipótesis, evidencia y calibración</div><p class="small">'+esc(r.layer2)+'</p><p class="small">'+esc(r.layer3)+'</p></div><div class="mentor info"><div class="avatar"><span class="ep-icon ep-icon--mentor"></span></div><div><div class="sev">REGLA TRANSFERIBLE</div><p class="small mentor-text">'+esc(r.layer4)+'</p></div></div></div></div></div>';}catch(e){error('El reveal todavía no está autorizado.');}}
publicDemo();(async function(){try{if(await getAuthToken())start();}catch(_){}})();
})();
</script><script src="/platform-nav.js" defer></script></body></html>
