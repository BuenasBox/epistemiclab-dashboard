<body>
<main class="wrap">
  <div class="eyebrow">Interpretación de tu progreso</div>
  <h1>Tu Mentor</h1>
  <p class="lead">Análisis basado en tu evidencia real. Cada observación se basa solo en lo que ya demostraste: tus fortalezas, áreas de mejora, calibración y preparación.</p>

  <div class="src" id="src"><span class="d"></span> <span id="srcLabel">Cargando…</span></div>
  <div id="cards"></div>

</main>

<script src="/platform-nav.js" defer></script>

<script src="./mentor-cognitivo.js?v=20260718-1"></script>
<script src="./mentor-cognitivo-ui.js"></script>
<script>
(function () {
  "use strict";
  var EP_ENDPOINT = "https://hylknjjhmxsuuwbsslkr.supabase.co/functions/v1/get-epistemic-profile-dashboard";

  function setSource(kind, text) {
    var el = document.getElementById('src');
    el.className = 'src ' + kind;
    document.getElementById('srcLabel').textContent = text;
  }

  async function load() {
    var events = (window.EpistemicProfile && window.EpistemicProfile.dump) ? window.EpistemicProfile.dump() : [];
    var token = await getAuthToken();
    var metrics = null, live = false;
    if (token) {
      try {
        var controller = new AbortController();
        var timeout = setTimeout(function(){ controller.abort(); }, 15000);
        var r;
        try {
          r = await fetch(EP_ENDPOINT, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store', signal: controller.signal });
        } finally { clearTimeout(timeout); }
        if (!r.ok) throw new Error('Profile status: ' + r.status);
        var j = await r.json();
        if (j && j.ok && j.bundle && j.bundle.summary && j.bundle.summary.data) { metrics = j.bundle.summary.data.metrics || {}; live = true; }
      } catch (e) { /* degradación elegante → estado vacío */ }
    }
    if (!metrics) {
      metrics = {};
      if (!token) events = [];
    }
    setSource(live ? 'live' : 'sample',
      live ? 'Analizando tu progreso (en vivo)' : (token ? 'No pudimos cargar tu progreso' : 'Sin sesión autenticada · inicia sesión para ver tu perfil'));
    var result = window.MentorCognitivo.interpret({ metrics: metrics, events: events });
    // renderReveal pinta el anillo de preparación + mapa de competencias
    // animado, y debajo las mismas Mentor Cards de siempre con el detalle
    // evidenciado (render() sigue existiendo tal cual para otros usos, como
    // adaptive-review y dashboard, que inyectan un solo mensaje puntual).
    window.MentorCognitivoUI.renderReveal(document.getElementById('cards'), result);
  }
  load();
})();
</script>
