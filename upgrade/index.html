<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planes de acceso · EpistemicLab</title>
  <link rel="stylesheet" href="./upgrade.css">
  <script src="../shared/session-store.js"></script>
  <script src="../shared/supabase-public-config.js"></script>
  <script src="../shared/auth-providers/supabase-auth-provider.js"></script>
  <script src="../shared/auth-provider.js"></script>
  <script src="../shared/upgrade-request-store.js"></script>
  <script src="./upgrade.js"></script>
</head>
<body>
  <main class="upgrade-shell">
    <nav class="upgrade-nav" aria-label="Navegación principal">
      <a href="/">EpistemicLab</a>
      <a href="/login/">Iniciar sesión</a>
    </nav>

    <header class="upgrade-hero">
      <p class="upgrade-eyebrow">Acceso a EpistemicLab</p>
      <h1>Elige el nivel de práctica que necesitas</h1>
      <p>
        La asignación de planes todavía se gestiona de forma manual.
        No se realizará ningún cobro desde esta página.
      </p>
    </header>

    <section class="plan-grid" data-plan-grid aria-label="Planes disponibles">
      <article class="plan-card">
        <h2>Demo</h2>
        <a class="plan-card__cta" href="/login/">Iniciar sesión</a>
      </article>
      <article class="plan-card">
        <h2>Premium</h2>
        <button class="plan-card__cta" type="button" data-upgrade-request>
          Solicitar actualización
        </button>
      </article>
      <article class="plan-card">
        <h2>Acceso Completo</h2>
        <button class="plan-card__cta" type="button" data-upgrade-request>
          Solicitar actualización
        </button>
      </article>
    </section>
    <p class="upgrade-feedback" data-upgrade-feedback role="status"></p>
  </main>
</body>
</html>
