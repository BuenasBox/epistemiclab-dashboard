<script>window.addEventListener('DOMContentLoaded',function(){if(window.Sentry)Sentry.init({dsn:"https://e155fc5d71bdb7a61a98f949c560531a@o4511743369347072.ingest.us.sentry.io/4511743386910720"});});</script>

<body>
<div class="wrap">
  <div class="eyebrow">Tu próximo paso personalizado</div>
  <h1>Tu recorrido, ahora</h1>
  <p class="lead">La plataforma analiza tu progreso y recomienda exactamente qué practicar a continuación, basándose en tu desempeño, áreas de mejora y estado de preparación.</p>
  <div class="src" id="src"><span class="d"></span> <span id="srcLabel">Cargando…</span></div>
  <div id="decision"></div>
  <div class="qa ll-in" id="qa"></div>
  <div class="rat ll-in" id="rat"></div>
</div>

<script src="/platform-nav.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
<script src="../shared/auth-token.js"></script>
<script src="./learning-loop-engine.js?v=20260718-2"></script>
<script>
(function () {
  "use strict";
  var PROFILE_ENDPOINT = "https://hylknjjhmxsuuwbsslkr.supabase.co/functions/v1/get-epistemic-profile-dashboard";

  var EMPTY = {
    summary: { data: { metrics: {} } }, recent_sessions: { data: [] },
    open_misconceptions: { data: [] }, recommendations: { data: [] },
    readiness: { data: { components: [] } }
  };

  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function setSrc(kind, text){ var el=document.getElementById('src'); el.className='src '+kind; document.getElementById('srcLabel').textContent=text; }

  function renderDecision(r){
    var halt = r.halt;
    var gate = r.simulation_gate || {};
    document.getElementById('decision').innerHTML =
      '<div class="decision ll-in'+(halt?' halt':'')+'">'+
        '<div class="state-row">'+
          '<span class="pill state">'+esc({cold_start:'Inicio',reinforce:'Refuerzo',progress:'Progreso',simulation_ready:'Simulacro disponible',exam_ready:'Preparación completa'}[r.state]||r.state)+'</span>'+
          (halt?'<span class="pill halt">Detener y reforzar</span>':'<span class="pill go">Avanzar</span>')+
        '</div>'+
        '<div class="next-label">Siguiente práctica</div>'+
        '<div class="next-practice">'+esc(r.next.label)+'</div>'+
        '<p class="next-reason">'+esc(r.next.reason)+'</p>'+
        '<div class="gate">Puerta del simulacro: '+(gate.open?'abierta':'cerrada')+
          ' · preparación '+(gate.current==null?'sin evidencia':gate.current+'%')+' / '+(gate.threshold<=1?Math.round(gate.threshold*100):gate.threshold)+'%'+
          (r.blocker?(' · frena: '+esc(r.blocker.label)+' ('+esc({metric:'métrica',competency:'competencia',component:'componente'}[r.blocker.kind]||r.blocker.kind)+')'):'')+'</div>'+
      '</div>';
  }
  function renderQA(a){
    var Q = [
      ['¿Qué práctica sigue?', a.whatNext], ['¿Por qué?', a.why],
      ['¿Qué idea errónea corregir primero?', a.whichMisconceptionFirst],
      ['¿Qué competencia frena el progreso?', a.whichCompetencyBlocking],
      ['¿Cuándo repetir Botellas?', a.repeatBottleWhen], ['¿Cuándo pasar a Etiquetas?', a.moveToLabelWhen],
      ['¿Cuándo recomendar Simulacro Completo?', a.recommendFullSimWhen], ['¿Cuándo detener y reforzar?', a.haltWhen]
    ];
    document.getElementById('qa').innerHTML = Q.map(function(x){
      return '<div class="qa-row ll-in"><div class="qa-q">'+esc(x[0])+'</div><div class="qa-a">'+esc(x[1])+'</div></div>';
    }).join('');
  }
  function renderRat(r){
    document.getElementById('rat').innerHTML = '<b>Base de la decisión:</b><ul>'+
      r.rationale.map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul>';
  }
  async function fetchProfile(token){
    var controller = new AbortController();
    var timeout = setTimeout(function(){ controller.abort(); }, 15000);
    try {
      var response = await fetch(PROFILE_ENDPOINT, {
        headers:{ Authorization:'Bearer '+token }, cache:'no-store', signal:controller.signal
      });
      if (!response.ok) throw new Error('Profile status: '+response.status);
      var payload = await response.json();
      if (!payload || payload.ok !== true || !payload.bundle) throw new Error('Invalid profile payload');
      return payload.bundle;
    } finally { clearTimeout(timeout); }
  }
  async function load(){
    var token = null;
    var bundle = null, live = false;
    try { token = typeof getAuthToken === 'function' ? await getAuthToken() : null; } catch(e) {}
    if (token) {
      try {
        bundle = await fetchProfile(token);
        live = true;
      } catch(e) { live = false; }
    }
    if (!live) bundle = EMPTY;
    setSrc(live?'live':'sample', live?'Analizando tu progreso en vivo':(token?'No pudimos cargar tu progreso':'Inicia sesión para construir tu plan'));
    var r = window.LearningLoop.fromEndpoints(bundle);
    renderDecision(r); renderQA(r.answers); renderRat(r);
  }
  load();
})();
</script>
</body>
</html>
