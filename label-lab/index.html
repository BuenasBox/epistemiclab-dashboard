<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Guided — EpistemicLab</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/platform-nav.css">
<style>
/* Tokens y componentes del Design System (continuos con SAT/Bottle). Sin tokens nuevos. */
:root{
  --bg:#1a1119;--panel:#241823;--panel2:#2e1f2c;--ink:#f5ecf2;--muted:#b79fb0;
  --wine:#7b2740;--wine2:#9c3354;--gold:#c9a227;--line:#3d2c39;--ok:#3fa86b;--warn:#d99a2b;--block:#c1483f;
  --r-ctl:8px;--r-card:12px;--r-pill:999px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
h1{font-size:25px;margin:0 0 .3em}h2{font-size:20px;margin:0 0 .4em}h3{font-size:17px;margin:0 0 .4em}
.serif{font-family:var(--serif)}.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:11.5px}.gold{color:var(--gold)}
p{margin:0 0 .8em}
.wrap{max-width:980px;margin:0 auto;padding:var(--s6) var(--s5)}
.topline{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:var(--s4);margin-bottom:var(--s5)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:16px}
.brand .dot{width:20px;height:20px;border-radius:var(--r-pill);background:radial-gradient(circle at 35% 30%,var(--wine2),var(--wine) 70%);box-shadow:0 0 0 1px var(--gold) inset}
.crumbs{font-size:13px;color:var(--muted)}.crumbs b{color:var(--ink)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.eyebrow::before{content:"";width:14px;height:1px;background:var(--gold)}
.btn{font-family:inherit;font-size:14px;border-radius:var(--r-ctl);padding:10px 16px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--gold)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--wine2),var(--wine));border-color:transparent;font-weight:600}.btn.ghost{background:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.02);white-space:nowrap}
.chip.gold{border-color:rgba(201,162,39,.5);color:var(--gold)}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s5)}
.card.tight{padding:var(--s4)}
.card-label{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hairline{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5;margin:var(--s5) 0}
.grid{display:grid;gap:var(--s4)}.g2{grid-template-columns:1.1fr .9fr}
.note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-ctl);padding:var(--s3) var(--s4);background:rgba(255,255,255,.015)}
.avatar{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:grid;place-items:center;font-size:15px;background:radial-gradient(circle at 35% 30%,var(--wine2),var(--wine) 75%);border:1px solid var(--gold)}
.meter{height:8px;border-radius:var(--r-pill);background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.meter>span{display:block;height:100%;background:linear-gradient(90deg,var(--wine2),var(--gold))}
/* Label Card hero (variante de Wine Card) */
.label-hero{background:#efe6d6;color:#2a1a12;border-radius:6px;padding:18px 16px;font-family:var(--serif);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:240px;margin:0 auto;position:relative}
.label-hero .est{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7b2740}
.label-hero .nm{font-size:19px;margin:8px 0 2px}
.label-hero .sub{font-size:12px;color:#5a4636;font-style:italic}
.label-hero .line{height:1px;background:#c9a227;margin:10px 18px}
.label-hero .meta{font-size:11px;color:#3a2a1e;letter-spacing:.04em}
.label-hero .zone-mark{outline:2px dashed rgba(123,39,64,.55);outline-offset:3px;border-radius:3px}
/* timeline */
.steps{display:flex;gap:6px;align-items:center;position:relative;margin:var(--s5) 0}
.steps::before{content:"";position:absolute;left:11px;right:11px;top:11px;height:1px;background:var(--line)}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative;z-index:1}
.step .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.step.done .dot{background:var(--ok);color:#0d2b1c;border-color:transparent}
.step.active .dot{border-color:var(--gold);color:var(--gold)}
.step .lbl{font-size:10px;color:var(--muted)}.step.active .lbl{color:var(--gold)}
/* options */
.opt{display:block;width:100%;text-align:left;padding:11px var(--s4);border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--panel2);color:var(--ink);margin-bottom:8px;cursor:pointer;font-family:inherit;font-size:14px}
.opt:hover{border-color:var(--gold)}.opt.sel{background:var(--wine);border-color:transparent;font-weight:600}
.opt small{display:block;color:var(--muted);font-weight:400;margin-top:2px}.opt.sel small{color:rgba(255,255,255,.8)}
/* Confidence Control (componente transversal del Design System) */
.conf{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:rgba(201,162,39,.05)}
.conf .q{font-size:11.5px;color:var(--gold);margin-bottom:8px;font-weight:600}
.conf .opts{display:flex;gap:8px;flex-wrap:wrap}
.pillbtn{font-family:inherit;font-size:12.5px;padding:8px 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;min-height:36px}
.pillbtn.sel{border-color:var(--gold);color:var(--gold);background:rgba(201,162,39,.12)}
/* mentor / states / feedback */
.mentor{display:flex;gap:var(--s3);padding:var(--s4);border-radius:var(--r-card);background:var(--panel2);border:1px solid var(--line);border-left-width:3px;margin-bottom:10px}
.mentor.info{border-left-color:var(--gold)}.mentor.ok{border-left-color:var(--ok)}.mentor.warn{border-left-color:var(--warn)}.mentor.crit{border-left-color:var(--block)}
.mentor .sev{font-size:11.5px;font-weight:600}
.mentor.info .sev{color:var(--gold)}.mentor.ok .sev{color:var(--ok)}.mentor.warn .sev{color:var(--warn)}.mentor.crit .sev{color:var(--block)}
.state{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line)}
.state .d{width:8px;height:8px;border-radius:50%}.state.eval .d{background:var(--gold)}.state.done .d{background:var(--ok)}
.fb-row{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.fb-row:last-child{border-bottom:none}
.tone{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap}
.tone.ok{color:var(--ok);border:1px solid var(--ok)}.tone.near{color:var(--gold);border:1px solid var(--gold)}.tone.rev{color:var(--warn);border:1px solid var(--warn)}.tone.con{color:var(--block);border:1px solid var(--block)}
.celebrate{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ok);color:var(--ok);font-size:22px;margin:0 auto var(--s3)}
.delta{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:rgba(255,255,255,.02);margin-bottom:10px}
.delta .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:0 0 34px;background:var(--panel2);font-size:15px}
.delta .plus{color:var(--ok);font-weight:600;font-size:12px}
.flowbar{display:flex;gap:10px;margin-top:var(--s5)}
.center{text-align:center}
@media (max-width:720px){.g2{grid-template-columns:1fr}.wrap{padding:var(--s4)}.fb-row{grid-template-columns:1fr;text-align:left;gap:4px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <div class="brand"><span class="dot"></span> EpistemicLab</div>
    <div class="crumbs">Practicar › <b>Label Guided</b></div>
    <div style="flex:1"></div>
    <span class="chip gold" id="compChip">Teoría · Conclusiones</span>
  </div>
  <div id="app" aria-live="polite"></div>
  <div class="note" id="fixtureNote" style="margin-top:24px">Contenido provisional (fixture). El dataset real lo entrega el backend con el contrato <code>label-guided.items.v1</code>.</div>
</div>

<script src="./data/label-items.sample.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/auth-token.js"></script>
<script src="../epistemic-profile/epistemic-profile-client.js"></script>
<script src="/ep-bootstrap.js"></script>
<script>
(function(){
  "use strict";
  var DATA = window.LABEL_GUIDED_ITEMS || { items: [] };
  var EP = window.EpistemicProfile;
  var app = document.getElementById('app');
  var CONF = ["Intuyo","Bastante seguro","Seguro"];
  var TONE = { coincide:'ok', cerca:'near', revisar:'rev', contradiccion:'con' };
  var TONE_LABEL = { coincide:'Coincide', cerca:'Cerca', revisar:'Revisar', contradiccion:'Posible contradicción' };

  var S = null;
  function reset(i){
    var idx = i % (DATA.items.length || 1);
    S = { screen:'frame', itemIndex:idx, item:DATA.items[idx], zoneIdx:0, answers:{}, hyp:{}, finished:false };
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function render(){
    if(!S.item){ app.innerHTML='<div class="card">No hay etiquetas en el set.</div>'; return; }
    document.getElementById('compChip').textContent=(S.item.competencies||[]).join(' · ');
    ({frame:renderFrame,parse:renderParse,hypothesis:renderHypothesis,evaluating:renderEvaluating,reveal:renderReveal,done:renderDone}[S.screen]||renderFrame)();
  }

  function labelHtml(activeZone){
    var L=S.item.label||{};
    function z(id,html){ return '<span class="'+(activeZone===id?'zone-mark':'')+'">'+html+'</span>'; }
    return '<div class="label-hero">'+
      '<div class="est">'+z('producer',esc(L.estate))+'</div>'+
      '<div class="nm">'+esc(L.wine)+'</div>'+
      '<div class="sub">'+z('classification',esc(L.classification))+' · '+z('style',esc(L.classification&&L.classification.indexOf('Trocken')>=0?'':''))+'</div>'+
      '<div class="line"></div>'+
      '<div class="meta">'+z('origin',esc(L.region))+' · '+z('vintage',esc(L.vintage))+' · '+esc(L.abv)+'</div>'+
    '</div>';
  }

  function timelineHtml(){
    var z=S.item.zones, out='<div class="steps">';
    for(var i=0;i<z.length;i++){
      var cls=i<S.zoneIdx?'done':(i===S.zoneIdx?'active':'');
      var mk=i<S.zoneIdx?'✓':(i===S.zoneIdx?'▶':'○');
      out+='<div class="step '+cls+'"><span class="dot">'+mk+'</span><span class="lbl">'+esc(z[i].label)+'</span></div>';
    }
    return out+'</div>';
  }

  function confHtml(current){
    return '<div class="conf"><div class="q">¿Cuánta seguridad tienes en esta lectura?</div><div class="opts">'+
      CONF.map(function(c){return '<button class="pillbtn'+(current===c?' sel':'')+'" data-conf="'+esc(c)+'">'+esc(c)+'</button>';}).join('')+
      '</div></div>';
  }

  function renderFrame(){
    app.innerHTML=
      '<div class="eyebrow">Módulo · inferencia documental · transforma el Epistemic Profile</div>'+
      '<h1 class="serif">Label Guided</h1>'+
      '<p class="muted" style="max-width:640px">Aprende a <b>leer cualquier etiqueta</b> — denominación, clasificación, añada, términos legales — y a deducir estilo, calidad y guarda. Y a distinguir lo que <i>significa algo</i> de lo que <i>solo vende</i>.</p>'+
      '<div class="note" style="max-width:640px;margin-bottom:18px">En el examen la cata es ciega, sin etiqueta. Esto entrena la <b>teoría de Unit 1</b> y tu expectativa de estilo. <b>No memorizamos etiquetas: aprendemos a parsearlas.</b></div>'+
      '<div class="card" style="max-width:640px"><div class="card-label">Esta sesión</div>'+
      '<h3>1 etiqueta · 5 zonas de lectura · ~6 min</h3>'+
      '<p class="small muted">En cada zona marcas tu lectura y tu nivel de confianza. Al final, qué cambió en ti.</p>'+
      '<div class="flowbar"><button class="btn primary" id="start">Empezar →</button></div></div>';
    document.getElementById('start').onclick=function(){
      EP&&EP.startSession({module:'label-guided',competencies:S.item.competencies});
      S.screen='parse'; S.zoneIdx=0; render();
    };
  }

  function renderParse(){
    var z=S.item.zones[S.zoneIdx];
    var a=S.answers[z.id]||{};
    var opts=z.options.map(function(o){
      return '<button class="opt'+(a.opt===o.id?' sel':'')+'" data-opt="'+esc(o.id)+'">'+esc(o.text)+(o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</button>';
    }).join('');
    var m=z.mentor||{sev:'info',text:''};
    var ready = a.opt && a.conf;
    app.innerHTML=
      '<div class="eyebrow">Lee la etiqueta · zona '+(S.zoneIdx+1)+' de '+S.item.zones.length+'</div>'+
      '<h2 class="serif">'+esc(z.prompt)+'</h2>'+ timelineHtml()+
      '<div class="grid g2"><div>'+
        '<div class="card center"><div class="card-label" style="text-align:left">Etiqueta en lectura · identidad oculta</div>'+labelHtml(z.id)+
          '<p class="xs muted" style="margin-top:8px">Zona activa resaltada: <b>'+esc(z.label)+'</b></p></div>'+
        '<div class="card tight" style="margin-top:14px"><div class="card-label">'+esc(z.label)+'</div>'+opts+ confHtml(a.conf)+'</div>'+
        '<div class="flowbar">'+(S.zoneIdx>0?'<button class="btn ghost" id="back">Atrás</button>':'')+
          '<button class="btn primary" id="next" style="flex:1" '+(ready?'':'disabled')+'>Confirmar y seguir →</button></div>'+
      '</div><div>'+
        '<div class="card-label">Mentor</div>'+
        '<div class="mentor '+esc(m.sev)+'"><div class="avatar">✦</div><div><div class="sev">PISTA</div><p class="small" style="margin:.2em 0 0">'+esc(m.text)+'</p></div></div>'+
        '<div class="state eval"><span class="d"></span> Se evaluará tu lectura <b>y tu confianza</b></div>'+
        '<div class="note" style="margin-top:14px">El control de confianza alimenta tu <b>calibración</b>. La identidad no se revela hasta el final (gobernanza).</div>'+
      '</div></div>';
    app.querySelectorAll('[data-opt]').forEach(function(b){ b.onclick=function(){ (S.answers[z.id]=S.answers[z.id]||{}).opt=b.getAttribute('data-opt'); render(); }; });
    app.querySelectorAll('[data-conf]').forEach(function(b){ b.onclick=function(){ (S.answers[z.id]=S.answers[z.id]||{}).conf=b.getAttribute('data-conf'); render(); }; });
    var back=document.getElementById('back'); if(back) back.onclick=function(){ S.zoneIdx--; render(); };
    document.getElementById('next').onclick=function(){
      var opt=z.options.filter(function(o){return o.id===a.opt;})[0]||{};
      EP&&EP.decisionMade({competency:(S.item.competencies||[])[0],itemId:S.item.id,zoneId:z.id,response:a.opt,correctnessBand:opt.band,confidence:a.conf,novel:S.item.novel});
      if(S.zoneIdx<S.item.zones.length-1){ S.zoneIdx++; render(); } else { S.screen='hypothesis'; render(); }
    };
  }

  function hypGroup(key,group){
    var sel=(S.hyp[key]||{}).opt;
    return '<div class="card-label"'+(key==='quality'?' style="margin-top:14px"':'')+'>'+esc(group.prompt)+'</div>'+
      group.options.map(function(o){return '<button class="opt'+(sel===o.id?' sel':'')+'" data-hyp="'+key+'" data-opt="'+esc(o.id)+'">'+esc(o.text)+'</button>';}).join('');
  }

  function renderHypothesis(){
    var h=S.item.hypothesis;
    var ready=(S.hyp.sweetness&&S.hyp.sweetness.opt)&&(S.hyp.quality&&S.hyp.quality.opt)&&S.hyp.conf;
    app.innerHTML=
      '<div class="eyebrow">Integra la lectura</div><h2 class="serif">Tu deducción de estilo</h2>'+
      '<p class="muted small" style="max-width:620px">Has leído las cinco zonas. ¿Qué vino esperas? Justifica con la palabra que manda, no con el cebo.</p>'+
      '<div class="grid g2"><div class="card">'+ hypGroup('sweetness',h.sweetness)+ hypGroup('quality',h.quality)+ confHtml((S.hyp.conf||null))+'</div>'+
      '<div><div class="mentor warn"><div class="avatar">✦</div><div><div class="sev">ATENCIÓN</div><p class="small" style="margin:.2em 0 0">Algunos términos tientan a una conclusión equivocada. Apóyate en la palabra reguladora correcta.</p></div></div>'+
      '<div class="flowbar"><button class="btn ghost" id="back">Atrás</button><button class="btn primary" id="submit" style="flex:1" '+(ready?'':'disabled')+'>Enviar deducción →</button></div></div></div>';
    app.querySelectorAll('[data-hyp]').forEach(function(b){ b.onclick=function(){ var k=b.getAttribute('data-hyp'); (S.hyp[k]=S.hyp[k]||{}).opt=b.getAttribute('data-opt'); render(); }; });
    app.querySelectorAll('[data-conf]').forEach(function(b){ b.onclick=function(){ S.hyp.conf=b.getAttribute('data-conf'); render(); }; });
    document.getElementById('back').onclick=function(){ S.screen='parse'; S.zoneIdx=S.item.zones.length-1; render(); };
    document.getElementById('submit').onclick=function(){
      var h2=S.item.hypothesis;
      var so=h2.sweetness.options.filter(function(o){return o.id===S.hyp.sweetness.opt;})[0]||{};
      var qo=h2.quality.options.filter(function(o){return o.id===S.hyp.quality.opt;})[0]||{};
      EP&&EP.hypothesisSubmitted({competency:'Conclusiones',itemId:S.item.id,confidence:S.hyp.conf,
        sweetness:{response:S.hyp.sweetness.opt,band:so.band},quality:{response:S.hyp.quality.opt,band:qo.band}});
      S.finished=true; S.screen='evaluating'; render();
    };
  }

  function renderEvaluating(){
    app.innerHTML='<div class="center" style="padding:60px 0"><div class="avatar" style="margin:0 auto 14px;width:46px;height:46px">✦</div>'+
      '<div class="state eval"><span class="d"></span> Analizando tu deducción y tu confianza…</div>'+
      '<p class="muted small" style="margin-top:14px"><a href="#" id="see" class="gold">ver resultado</a></p></div>';
    var go=function(e){ if(e)e.preventDefault(); S.screen='reveal'; render(); };
    document.getElementById('see').onclick=go; setTimeout(go,900);
  }

  function renderReveal(){
    if(!S.finished){ S.screen='parse'; return render(); }
    var it=S.item, rv=it.reveal;
    var rows=it.zones.map(function(z){
      var a=S.answers[z.id]||{}; var opt=z.options.filter(function(o){return o.id===a.opt;})[0]||{};
      var tone=TONE[opt.band]||'rev';
      return '<div class="fb-row"><span class="small">'+esc(z.label)+' <span class="xs muted">('+esc(a.conf||'—')+')</span></span>'+
        '<span class="tone '+tone+'">'+esc(TONE_LABEL[opt.band]||'Revisar')+'</span>'+
        '<span class="small muted">'+esc(opt.explain||'')+'</span></div>';
    }).join('');
    var so=it.hypothesis.sweetness.options.filter(function(o){return o.id===(S.hyp.sweetness||{}).opt;})[0]||{};
    var hypTone=TONE[so.band]||'rev';
    var badges=(rv.badges||[]).map(function(b){return '<span class="chip gold">'+esc(b)+'</span>';}).join(' ');
    var d=(EP&&EP.getSessionDelta())||{};
    var calMsg = d.calibration==='sobreconfianza'
      ? 'Fallaste alguna lectura en la que te declaraste seguro: ojo con la sobreconfianza en estos términos.'
      : (d.calibration==='infraconfianza' ? 'Acertaste con poca confianza: tu criterio es mejor de lo que crees.'
                                          : 'Tu confianza acompañó a tu acierto: bien calibrado en esta sesión.');
    var calSev = d.calibration==='sobreconfianza' ? 'warn' : 'ok';
    EP&&rv.misconception&&EP.misconception({id:rv.misconception.id,status:'resolved',title:rv.misconception.title});
    app.innerHTML=
      '<div class="eyebrow">Revelación + calibración</div><h2 class="serif">'+esc(rv.identity)+'</h2>'+
      '<div class="grid g2"><div>'+
        '<div class="card center">'+labelHtml(null)+'<div style="margin-top:10px">'+badges+'</div></div>'+
        '<div class="card tight" style="margin-top:14px"><div class="card-label">Tus lecturas (con tu confianza)</div>'+rows+
          '<div class="fb-row"><span class="small">Hipótesis de dulzor <span class="xs muted">('+esc(S.hyp.conf||'—')+')</span></span><span class="tone '+hypTone+'">'+esc(TONE_LABEL[so.band]||'Revisar')+'</span><span class="small muted">'+esc(so.text||'')+'</span></div>'+
        '</div>'+
      '</div><div>'+
        '<div class="mentor '+calSev+'"><div class="avatar">✦</div><div><div class="sev">CALIBRACIÓN</div><p class="small" style="margin:.2em 0 0">'+esc(calMsg)+'</p></div></div>'+
        '<div class="mentor ok"><div class="avatar">✦</div><div><div class="sev">SÍNTESIS</div><p class="small" style="margin:.2em 0 0">'+esc(rv.mentorSynthesis)+'</p></div></div>'+
        (rv.misconception?'<div class="mentor crit"><div class="avatar">✦</div><div><div class="sev">IDEA CONSOLIDADA</div><p class="small" style="margin:.2em 0 0"><b>'+esc(rv.misconception.title)+'.</b> '+esc(rv.misconception.text)+'</p></div></div>':'')+
        '<div class="flowbar"><button class="btn primary" id="toDone" style="flex:1">Ver qué cambió en ti →</button></div>'+
      '</div></div>';
    document.getElementById('toDone').onclick=function(){ EP&&EP.sessionCompleted({module:'label-guided',itemId:it.id}); S.screen='done'; render(); };
  }

  function renderDone(){
    var d=(EP&&EP.getSessionDelta())||{accuracy:'—',misconceptions:[],transferTouched:false,calibration:'calibrado'};
    var calLine = d.calibration==='sobreconfianza' ? 'Sobreconfianza detectada y señalada · a trabajar'
                 : (d.calibration==='infraconfianza' ? 'Tiendes a infravalorar tu criterio · a reforzar'
                 : 'Confianza alineada con tu acierto');
    var misc=(d.misconceptions||[]).map(function(m){
      return '<div class="delta"><div class="ic">💡</div><div><b class="small">Idea consolidada</b><div class="xs muted" style="margin-top:2px">'+esc(m.title||'Concepto reforzado')+'</div></div></div>';
    }).join('');
    var transfer=d.transferTouched?'<div class="delta"><div class="ic">🔄</div><div><b class="small">Transferencia probada</b><div class="xs muted" style="margin-top:2px">Aplicado a una etiqueta reservada como nueva → aprendizaje real, no memoria.</div></div></div>':'';
    app.innerHTML=
      '<div class="center" style="max-width:560px;margin:0 auto"><div class="celebrate">✓</div>'+
      '<h2 class="serif">Qué cambió en ti</h2><p class="muted small">No "bien hecho": esto es lo que ahora sabes y razonas distinto.</p></div>'+
      '<div style="max-width:560px;margin:18px auto 0">'+
        '<div class="delta"><div class="ic">📚</div><div><b class="small">Teoría · denominaciones y clasificaciones</b><div class="meter" style="margin-top:6px"><span style="width:58%"></span></div><div class="xs muted" style="margin-top:4px">Sistema de lectura aplicable a otras etiquetas · aciertos: '+esc(d.accuracy)+'</div></div></div>'+
        '<div class="delta"><div class="ic">🎯</div><div><b class="small">Calibración</b><div class="xs muted" style="margin-top:2px">'+esc(calLine)+'</div></div></div>'+
        misc + transfer +
        '<div class="delta" style="border-color:rgba(201,162,39,.45)"><div class="ic">📈</div><div><b class="small">Aporte a Exam Readiness <span class="plus">registrado</span></b><div class="xs muted" style="margin-top:2px">El Epistemic Profile recibió tus señales y tu confianza. <i>(Stub hasta el módulo de perfil.)</i></div></div></div>'+
        '<div class="state done" style="margin-top:8px"><span class="d"></span> Epistemic Profile actualizado · repaso espaciado programado</div>'+
        '<div class="flowbar" style="justify-content:center"><button class="btn" id="another">Otra etiqueta</button><a class="btn ghost" href="/login/?next=/dashboard/">Guardar mi progreso</a><a class="btn ghost" href="../">Volver al Dashboard</a></div>'+
      '</div>';
    document.getElementById('another').onclick=function(){ reset(S.itemIndex+1); render(); };
  }

  reset(0); render();
})();
</script>
<script src="/platform-nav.js" defer></script>
</body>
</html>
