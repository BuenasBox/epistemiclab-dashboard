<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiquetas — EpistemicLab</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="/platform-nav.css"><link rel="stylesheet" href="/shared/epistemic-icons.css"><link rel="stylesheet" href="/shared/theme-wine.css"><link rel="stylesheet" href="/shared/theme-platform.css"><link rel="stylesheet" href="/shared/ui-buttons.css"><link rel="stylesheet" href="./label-lab.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
<script src="/shared/supabase-public-config.js"></script><script src="../shared/auth-token.js"></script><script src="./data/label-demo.public.js"></script>
</head>
<body>
<div class="wrap"><header class="topline"><div class="flex-1"></div><span class="chip gold" id="statusChip">Label Lab Pro</span></header><main id="app" aria-live="polite"></main><div class="note mt-24" id="networkStatus" hidden></div></div>
<script>
(function(){
  'use strict';
  var app=document.getElementById('app'), chip=document.getElementById('statusChip'), network=document.getElementById('networkStatus');
  var demo=window.LABEL_DEMO_PUBLIC||{}; var state={session:null,step:null,selection:'',evidence:[],confidence:'',justification:'',busy:false};
  var API=((window.WSET_SUPABASE_CONFIG||{}).url||'https://hylknjjhmxsuuwbsslkr.supabase.co')+'/functions/v1/';
  var KEY=(window.WSET_SUPABASE_CONFIG||{}).publishableKey||'';
  function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function labelHtml(){var l=demo.label||{};return '<div class="label-hero"><div class="est">'+esc(l.estate)+'</div><div class="nm">'+esc(l.wine)+'</div><div class="sub">'+esc(l.classification)+'</div><div class="line"></div><div class="meta">'+esc(l.region)+' · '+esc(l.vintage)+' · '+esc(l.abv)+'</div></div>';}
  function setNetwork(){network.hidden=navigator.onLine;network.textContent='Sin conexión. La sesión no se enviará hasta recuperar la red.';}
  window.addEventListener('online',setNetwork);window.addEventListener('offline',setNetwork);setNetwork();
  function renderDemo(){chip.textContent='Demo pública · sin progreso';app.innerHTML='<div class="eyebrow">Módulo · inferencia documental</div><h1 class="serif">Etiquetas</h1><p class="muted bl-narrow">Aprende a separar evidencia explícita, términos regulados e inferencias que necesitan cautela.</p><div class="grid g2"><div class="card center">'+labelHtml()+'</div><div class="card"><div class="card-label">Demo segura</div><p class="small">'+esc(demo.note)+'</p><div class="state eval"><span class="d"></span> La evaluación Pro requiere una cuenta activa.</div><div class="flowbar"><a class="btn btn--shine btn--glow flex-1" href="/login/?next=/label-lab/">Entrar para practicar</a></div></div></div>';}
  function renderLoading(text){chip.textContent='Cargando sesión';app.innerHTML='<div class="center bl-evaluating"><div class="avatar bl-avatar-lg"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span></div><div class="state eval"><span class="d"></span> '+esc(text||'Preparando Label Lab Pro…')+'</div></div>';}
  function renderError(message,link){chip.textContent='Label Lab Pro';app.innerHTML='<div class="card bl-narrow"><div class="card-label">No pudimos continuar</div><h2 class="serif">'+esc(message)+'</h2><p class="small muted">Tu progreso server-side no se ha marcado como completado.</p><div class="flowbar"><button class="btn btn--ghost" id="retry">Reintentar</button>'+(link?'<a class="btn btn--shine" href="/login/?next=/label-lab/">Iniciar sesión</a>':'')+'</div></div>';var r=document.getElementById('retry');if(r)r.onclick=start;}
  function stepView(){var s=state.step;if(!s)return renderError('No hay un paso activo.');chip.textContent='Label Lab Pro · '+esc(s.kind);var opts=(s.options||[]).map(function(o){var id=typeof o==='string'?o:o.id;var text=typeof o==='string'?o:(o.text||o.label||o.id);return '<button class="btn btn--ghost opt '+(state.selection===id?' sel':'')+'" data-option="'+esc(id)+'">'+esc(text)+'</button>';}).join('');var evidence=(s.evidence||[]).map(function(e){return '<button class="btn btn--ghost opt '+(state.evidence.indexOf(e.id)>=0?' sel':'')+'" data-evidence="'+esc(e.id)+'"><b>'+esc(e.label)+'</b><small>'+esc(e.value)+'</small></button>';}).join('');var ready=state.selection||state.justification||state.confidence;app.innerHTML='<div class="eyebrow">Label Lab Pro · paso activo</div><h2 class="serif">'+esc(s.prompt||s.id)+'</h2><div class="steps"><div class="step active"><span class="dot">1</span><span class="lbl">Evidencia</span></div><div class="step active"><span class="dot">2</span><span class="lbl">Lectura</span></div><div class="step"><span class="dot">3</span><span class="lbl">Confianza</span></div></div><div class="grid g2"><div><div class="card"><div class="card-label">Evidencia visible</div>'+labelHtml()+'<div class="mt-14">'+(evidence||'<p class="small muted">Selecciona la evidencia que realmente usas.</p>')+'</div></div></div><div class="card"><div class="card-label">Tu respuesta</div>'+(opts||'<textarea id="justification" class="opt" rows="5" placeholder="Escribe tu lectura sin inventar datos…">'+esc(state.justification)+'</textarea>')+'<div class="conf"><div class="q">Nivel de confianza</div><div class="opts">'+['cannot_determine','intuition','probable','fairly_sure','certain'].map(function(c){return '<button class="btn btn--ghost pillbtn '+(state.confidence===c?' sel':'')+'" data-confidence="'+c+'">'+c+'</button>';}).join('')+'</div></div><div class="flowbar"><button class="btn btn--shine btn--glow flex-1" id="send" '+(ready?'':'disabled')+'>Enviar paso →</button></div></div></div>';app.querySelectorAll('[data-option]').forEach(function(b){b.onclick=function(){state.selection=b.getAttribute('data-option');stepView();};});app.querySelectorAll('[data-evidence]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-evidence'),i=state.evidence.indexOf(id);if(i>=0)state.evidence.splice(i,1);else state.evidence.push(id);stepView();};});app.querySelectorAll('[data-confidence]').forEach(function(b){b.onclick=function(){state.confidence=b.getAttribute('data-confidence');stepView();};});var ta=document.getElementById('justification');if(ta)ta.oninput=function(){state.justification=ta.value;};document.getElementById('send').onclick=submit;}
  async function api(path,body){if(!navigator.onLine)throw new Error('OFFLINE');var token=await getAuthToken();if(!token)throw new Error('NO_AUTH_SESSION');var response=await fetch(API+path,{method:'POST',cache:'no-store',headers:{'Authorization':'Bearer '+token,'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});var data=await response.json().catch(function(){return {};});if(!response.ok)throw new Error(data.error||'REQUEST_FAILED');return data;}
  function requestKey(){var key=sessionStorage.getItem('label_lab_pro_request_key');if(!key){key=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random());sessionStorage.setItem('label_lab_pro_request_key',key);}return key;}
  async function start(){renderLoading('Recuperando tu sesión…');try{var data=await api('start-label-session',{request_key:requestKey()});state.session=data.session_id;state.step=data.step;stepView();}catch(e){if(e.message==='NO_AUTH_SESSION')renderError('La práctica Pro requiere iniciar sesión.',true);else if(e.message==='OFFLINE')renderError('Estás sin conexión.');else renderError('La asignación no está disponible.');}}
  async function submit(){if(state.busy)return;state.busy=true;renderLoading('Evaluando tu paso en servidor…');var key=crypto.randomUUID?crypto.randomUUID():String(Date.now());try{var data=await api('submit-label-step',{session_id:state.session,idempotency_key:key,step_key:state.step.id,step_kind:state.step.kind,answer:{response:state.selection||state.justification,evidence_used:state.evidence,justification:state.justification,confidence:state.confidence}});if(data.step){state.step=data.step;state.selection='';state.evidence=[];state.justification='';state.confidence='';stepView();}else reveal();}catch(e){renderError(e.message==='OFFLINE'?'Estás sin conexión.':'No pudimos guardar este paso.');}finally{state.busy=false;}}
  async function reveal(){renderLoading('Preparando reveal autorizado…');try{var data=await api('reveal-label-session',{session_id:state.session});var r=data.reveal||{};chip.textContent='Label Lab Pro · completado';app.innerHTML='<div class="bl-reveal"><div class="eyebrow">Reveal autorizado por servidor</div><h2 class="serif">Qué cambió en tu lectura</h2><div class="grid g2"><div class="card center">'+labelHtml()+'</div><div><div class="mentor ok"><div class="avatar"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span></div><div><div class="sev">RESULTADO</div><p class="small mentor-text">'+esc(r.layer1||'Resultado registrado.')+'</p></div></div><div class="card tight"><div class="card-label">Comparación y evidencia</div><p class="small">'+esc(r.layer2||'Comparación de hipótesis y confianza registrada.')+'</p><p class="small">'+esc(r.layer3||'Evidencia usada y omitida registrada.')+'</p></div><div class="mentor info"><div class="avatar"><span class="ep-icon ep-icon--mentor" aria-hidden="true"></span></div><div><div class="sev">TRANSFERENCIA</div><p class="small mentor-text">'+esc(r.layer4||'Regla transferible registrada.')+'</p></div></div></div></div></div>';}catch(e){renderError('El reveal todavía no está autorizado.');}}
  renderDemo();
  (async function(){try{var token=await getAuthToken();if(token)start();}catch(_){}})();
})();
</script><script src="/platform-nav.js" defer></script>
</body></html>
